[input_parameters]
;目标年份
year=2022
;目标月份
month=9
;控制区域数量
region_num = 10
; 前体物种数量
species_num = 4
;后处理文件的前缀
aconc_file_prefix = 'D3_'
;后处理文件的后缀
aconc_file_suffix = '_Daily_ACONC_Sep_2022.nc'
; pollutants = ['NOx', 'SO2', 'NH3', 'VOC', 'O3_CN'];#'O3_CN'PM25_TOT
;cmaq模型后处理文件中的污染物种类，共18种
