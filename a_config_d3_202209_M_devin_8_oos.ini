[input_parameters]
;目标年份
year=2022
;目标月份
month=9
;控制区域数量
region_num = 10
; 前体物种数量
species_num = 4
;后处理文件的前缀
aconc_file_prefix = 'D3_'
;后处理文件的后缀
aconc_file_suffix = '_Daily_ACONC_Sep_2022.nc'
; pollutants = ['NOx', 'SO2', 'NH3', 'VOC', 'O3_CN'];#'O3_CN'PM25_TOT
;cmaq模型后处理文件中的污染物种类，共18种
species_in_cmaq=['HNO3', 'H2O2', 'N2O5', 'NO2', 'FORM', 'HONO','NO', 'O3_MDA8', 'SO2', 'NH3', 'OH', 'ISOP', 'TERP','ASO4IJ', 'ANO3IJ', 'ANH4IJ', 'ASOCIJ', 'PM25_TOT']
; city_names=['GZ','SZ','FS','DG','HZ','JM','ZH','ZQ','ZS','OTH','PRD']
;基准模型的名称
base_case_name="BASE"
;目标污染物的索引;7:O3_CN
target_pollutant_idx = 7
project_name = 'd3_#year#_#month#_MRSM_MDA8_O3_ppb_subregions_model'
unit = 'ppb'#'μg/m3'
#全区域同步控制的情景名
whole_region_full_control_case_name="everywhere"
#oos的前缀名
oos_aconc_file_prefix = 'D3_S'
oos_aconc_file_suffix = '_Daily_ACONC_Sep_2022.nc'
#其他区域的名称，对应Receptor文件中的OTH
oth_region_name = "gd-prd"
[input_files]
;用于创建RSM的数据目录，CMAQ后处理文件目录
aconc_dir = 'inputs/CMAQ/create_rsm'
;用于OOS的数据目录
oos_aconc_dir = 'inputs/CMAQ/oos'
;用于创建RSM的控制矩阵文件，和CMAQ后处理文件一一对应
matrix_file = 'inputs/Matrix_for_CreateRSM_D2_2022_deeprsm.csv'
;受体区域文件
receptor_file_txt='inputs/d3_117150_prd_grid_receptor.txt'
; ;受体区域文件
region_file_csv = 'inputs/d3_117150_prd_grid_receptor.csv'
;OOS的控制矩阵文件，与OOS的CMAQ后处理文件一一对应
oos_matrix_file = 'inputs/Matrix_for_OOS_8_Specified_Runs.csv'
;分部门置零浓度文件
sector_aconc_dir='inputs/CMAQ/sector'
;网格文件，和受体区域文件类似
grid_path = 'inputs/d3_117150_prd_grid.npy'
;边界文件
boundary_file='inputs/guangdong_cities.json'
;json区域边界文件
boundary_json_file='inputs/guangdong_cities.json'
;训练好的模型文件
trained_model_file='inputs/Trained_model/2022_Sep_Fine-tuned_DeepRSM_model_O3.pth'
;输出目录的根目录
output_dir ='outputs'
